name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - name: Tag matches the version in the source
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Checksums
        run: |
          cd src-tauri/target/release/bundle
          sha256sum rpm/*.rpm deb/*.deb | sed 's# [a-z]*/# #' > SHA256SUMS-linux
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle
          bash "$GITHUB_WORKSPACE/scripts/attach-to-release.sh" SHA256SUMS-linux rpm/*.rpm deb/*.deb

  windows:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "TAURI_SIGNING_PRIVATE_KEY secret not set: this installer will not be able to update itself"
            pnpm tauri build
          fi
      - name: Checksums and update feed
        run: |
          cd src-tauri/target/release/bundle/nsis
          sha256sum *-setup.exe | sed 's/ \*/  /' > ../SHA256SUMS-windows
          exe=$(ls *-setup.exe)
          if [ -f "$exe.sig" ]; then
            jq -n --arg version "${GITHUB_REF_NAME#v}" --arg signature "$(cat "$exe.sig")" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$exe" \
              --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version: $version, notes: $notes, pub_date: $date, platforms: {"windows-x86_64": {signature: $signature, url: $url}}}' > latest.json
          fi
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle
          files=(nsis/*-setup.exe)
          # Only a signed build has the update feed.
          if [ -f nsis/latest.json ]; then files+=(nsis/*-setup.exe.sig nsis/latest.json); fi
          bash "$GITHUB_WORKSPACE/scripts/attach-to-release.sh" SHA256SUMS-windows "${files[@]}"

  android:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Skip without a signing key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "ANDROID_KEYSTORE_BASE64 secret not set, skipping the Android build" && exit 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: env.KEYSTORE_BASE64 != ''
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.KEYSTORE_BASE64 != ''
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: env.KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: env.KEYSTORE_BASE64 != ''
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - name: Build and sign
        if: env.KEYSTORE_BASE64 != ''
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          pnpm install --frozen-lockfile
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          HONEYCOMB_KEYSTORE="$RUNNER_TEMP/release.jks" HONEYCOMB_KEYSTORE_PASS="$KEYSTORE_PASS" ./android-build.sh
          cd src-tauri/target/release/bundle/android && sha256sum *.apk > SHA256SUMS-android
      - name: Attach to release
        if: env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle/android
          bash "$GITHUB_WORKSPACE/scripts/attach-to-release.sh" SHA256SUMS-android *.apk
