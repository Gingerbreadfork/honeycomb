name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - name: Tag matches the version in the source
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  linux:
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Checksums
        run: |
          cd src-tauri/target/release/bundle
          sha256sum rpm/*.rpm deb/*.deb | sed 's# [a-z]*/# #' > SHA256SUMS-linux
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Honeycomb ${GITHUB_REF_NAME#v}" --generate-notes 2>/dev/null || true
          uploaded=0
          for f in src-tauri/target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/deb/*.deb; do
            if gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$f"; then uploaded=1; else echo "$(basename "$f") already on the release, keeping the published copy"; fi
          done
          # Checksums only make sense for the files this run actually published.
          [ "$uploaded" = 1 ] && gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" src-tauri/target/release/bundle/SHA256SUMS-linux || true

  android:
    needs: verify
    runs-on: ubuntu-22.04
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip without a signing key
        if: env.KEYSTORE_BASE64 == ''
        run: echo "ANDROID_KEYSTORE_BASE64 secret not set, skipping the Android build" && exit 0
      - uses: pnpm/action-setup@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        if: env.KEYSTORE_BASE64 != ''
        with:
          targets: aarch64-linux-android
      - name: Build and sign
        if: env.KEYSTORE_BASE64 != ''
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          pnpm install --frozen-lockfile
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          HONEYCOMB_KEYSTORE="$RUNNER_TEMP/release.jks" HONEYCOMB_KEYSTORE_PASS="$KEYSTORE_PASS" ./android-build.sh
          cd src-tauri/target/release/bundle/android && sha256sum *.apk > SHA256SUMS-android
      - name: Attach to release
        if: env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Honeycomb ${GITHUB_REF_NAME#v}" --generate-notes 2>/dev/null || true
          uploaded=0
          for f in src-tauri/target/release/bundle/android/*.apk; do
            if gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "$f"; then uploaded=1; else echo "$(basename "$f") already on the release, keeping the published copy"; fi
          done
          [ "$uploaded" = 1 ] && gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" src-tauri/target/release/bundle/android/SHA256SUMS-android || true
